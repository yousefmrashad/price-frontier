[project]
name = "price-frontier"
version = "0.1.0"
description = "Cache-aware blended $/Mtok pricing for OpenRouter models and providers"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "plotly>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
price-frontier = "price_frontier:app"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["test_price_frontier.py"]