[project]
name = "openpricer"
version = "0.1.0"
description = "OpenRouter blended $/Mtok pricing with a per-provider join and cost/throughput scatter"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "plotly>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
openrouter-blended-price = "openrouter_blended_price:app"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["test_openrouter_blended_price.py"]